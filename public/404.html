<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Central do Militar</title>
    <script type="text/javascript">
      // Técnica spa-github-pages (https://github.com/rafgraph/spa-github-pages).
      // O GitHub Pages serve este arquivo para qualquer rota que não exista
      // fisicamente (ex.: /centraldomilitar/carreiras/exercito). Em vez de mostrar
      // um 404, redirecionamos para o index.html preservando o caminho original,
      // que o script no <head> do index.html restaura antes do React montar.
      var pathSegmentsToKeep = 1 // mantém "/centraldomilitar" no caminho

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
