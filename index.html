<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Central do Militar — plataforma gratuita de consulta e ferramentas para as carreiras das Forças Armadas brasileiras."
    />
    <title>Central do Militar</title>
    <script type="text/javascript">
      // Restaura o caminho original após um redirecionamento feito pelo 404.html.
      // Necessário porque o GitHub Pages não interpreta rotas de uma SPA
      // (ex.: /carreiras/exercito) nativamente — ver public/404.html.
      // Técnica: https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
